name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build SmartMoney APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Clean Android Build Environment
        run: |
          # 1. Ensure lib layout is preserved
          if [ ! -d "lib" ] && [ -f "main.dart" ]; then
            mkdir -p lib/models lib/providers lib/screens lib/services lib/widgets
            mv -f *_model.dart habit_badge.dart lib/models/ 2>/dev/null || true
            mv -f *_provider.dart lib/providers/ 2>/dev/null || true
            mv -f *_tab.dart home_screen.dart lib/screens/ 2>/dev/null || true
            mv -f *_service.dart lib/services/ 2>/dev/null || true
            mv -f *_modal.dart *_dialog.dart custom_charts.dart lib/widgets/ 2>/dev/null || true
            mv -f main.dart lib/
          fi

          # 2. Re-create clean Android wrapper to ensure gradlew and tools exist
          rm -rf android
          flutter create --org com.example.smartmoney --platforms android .

          # 3. Add Android SMS & Notification permissions to AndroidManifest.xml
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              content = f.read()

          permissions = '''
              <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\"/>
              <uses-permission android:name=\"android.permission.RECEIVE_SMS\"/>
              <uses-permission android:name=\"android.permission.READ_SMS\"/>
              <uses-permission android:name=\"android.permission.VIBRATE\"/>
              <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>
              <uses-permission android:name=\"android.permission.USE_FULL_SCREEN_INTENT\"/>
              <uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\"/>
          '''
          receiver = '''
                  <receiver android:name=\"com.unarin.telephony.receivers.SmsReceiver\"
                      android:permission=\"android.permission.BROADCAST_SMS\"
                      android:exported=\"true\">
                      <intent-filter>
                          <action android:name=\"android.provider.Telephony.SMS_RECEIVED\"/>
                      </intent-filter>
                  </receiver>
          '''
          content = content.replace('<application', permissions + '\n    <application')
          content = content.replace('</activity>', '</activity>\n' + receiver)
          with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(content)
          "

          # 4. Inject subprojects namespace fix for telephony
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          if (namespace == null) {
                              namespace project.group
                          }
                      }
                  }
              }
          }
          EOF

          # 5. Ensure minSdkVersion is 21+ and multidex enabled
          python3 -c "
          app_gradle = 'android/app/build.gradle'
          with open(app_gradle, 'r', encoding='utf-8') as f:
              text = f.read()
          text = text.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21\n        multiDexEnabled true')
          text = text.replace('minSdkVersion = flutter.minSdkVersion', 'minSdkVersion = 21\n        multiDexEnabled = true')
          with open(app_gradle, 'w', encoding='utf-8') as f:
              f.write(text)
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartMoney-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
