name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build SmartMoney APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Clean Android Build Environment
        run: |
          # 1. Update outdated telephony dependency and import to modern another_telephony
          python3 -c "
          import os

          # Update pubspec.yaml
          if os.path.exists('pubspec.yaml'):
              with open('pubspec.yaml', 'r', encoding='utf-8') as f:
                  content = f.read()
              content = content.replace('telephony: ^0.2.0', 'another_telephony: ^0.4.1')
              with open('pubspec.yaml', 'w', encoding='utf-8') as f:
                  f.write(content)

          # Update sms_listener_service.dart
          sms_service = 'lib/services/sms_listener_service.dart'
          if os.path.exists(sms_service):
              with open(sms_service, 'r', encoding='utf-8') as f:
                  code = f.read()
              code = code.replace('package:telephony/telephony.dart', 'package:another_telephony/telephony.dart')
              with open(sms_service, 'w', encoding='utf-8') as f:
                  f.write(code)
          "

          # 2. Reconstruct lib layout if files were uploaded flat to root
          if [ ! -d "lib" ] && [ -f "main.dart" ]; then
            mkdir -p lib/models lib/providers lib/screens lib/services lib/widgets
            mv -f *_model.dart habit_badge.dart lib/models/ 2>/dev/null || true
            mv -f *_provider.dart lib/providers/ 2>/dev/null || true
            mv -f *_tab.dart home_screen.dart lib/screens/ 2>/dev/null || true
            mv -f *_service.dart lib/services/ 2>/dev/null || true
            mv -f *_modal.dart *_dialog.dart custom_charts.dart lib/widgets/ 2>/dev/null || true
            mv -f main.dart lib/
          fi

          # 3. Create fresh Android wrapper in safe path (bypasses hyphen in 'smart-money')
          rm -rf android
          mkdir -p /tmp/fresh_flutter_app
          flutter create --project-name smart_money_flutter --org com.dhana.smartmoney --platforms android /tmp/fresh_flutter_app
          cp -r /tmp/fresh_flutter_app/android ./android
          chmod +x android/gradlew

          # 4. Inject SMS & Notification permissions and receiver to AndroidManifest.xml
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              content = f.read()

          permissions = '''
              <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\"/>
              <uses-permission android:name=\"android.permission.RECEIVE_SMS\"/>
              <uses-permission android:name=\"android.permission.READ_SMS\"/>
              <uses-permission android:name=\"android.permission.SEND_SMS\"/>
              <uses-permission android:name=\"android.permission.READ_PHONE_STATE\"/>
              <uses-permission android:name=\"android.permission.VIBRATE\"/>
              <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>
              <uses-permission android:name=\"android.permission.USE_FULL_SCREEN_INTENT\"/>
              <uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\"/>
          '''
          receiver = '''
                  <receiver 
                      android:name=\"com.shounakmulay.telephony.sms.IncomingSmsReceiver\"
                      android:permission=\"android.permission.BROADCAST_SMS\"
                      android:exported=\"true\">
                      <intent-filter android:priority=\"999\">
                          <action android:name=\"android.provider.Telephony.SMS_RECEIVED\" />
                      </intent-filter>
                  </receiver>
          '''
          content = content.replace('<application', permissions + '\n    <application')
          content = content.replace('</activity>', '</activity>\n' + receiver)
          with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(content)
          "

          # 5. Inject Gradle compatibility flags
          cat << 'EOF' >> android/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.defaults.buildfeatures.buildconfig=true
          android.nonTransitiveRClass=false
          org.gradle.jvmargs=-Xmx4G
          EOF

          # 6. Ensure minSdkVersion is 23 (required for telephony features)
          echo -e "\nflutter.minSdkVersion=23" >> android/local.properties
          python3 -c "
          import os
          for fname in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              if os.path.exists(fname):
                  with open(fname, 'r', encoding='utf-8') as f:
                      t = f.read()
                  t = t.replace('flutter.minSdkVersion', '23')
                  with open(fname, 'w', encoding='utf-8') as f:
                      f.write(t)
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartMoney-Release-APK
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
