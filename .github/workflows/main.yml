name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build SmartMoney APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Clean Android Build Environment
        run: |
          # 1. Reconstruct lib folder structure if files were uploaded flat to root
          if [ ! -d "lib" ] && [ -f "main.dart" ]; then
            mkdir -p lib/models lib/providers lib/screens lib/services lib/widgets
            mv -f *_model.dart habit_badge.dart lib/models/ 2>/dev/null || true
            mv -f *_provider.dart lib/providers/ 2>/dev/null || true
            mv -f *_tab.dart home_screen.dart lib/screens/ 2>/dev/null || true
            mv -f *_service.dart lib/services/ 2>/dev/null || true
            mv -f *_modal.dart *_dialog.dart custom_charts.dart lib/widgets/ 2>/dev/null || true
            mv -f main.dart lib/
          fi

          # 2. Update pubspec.yaml to clean dependencies (removes heavy notification/audio packages)
          cat << 'EOF' > pubspec.yaml
          name: smart_money_flutter
          description: "SmartMoney Personal Finance Tracker"
          publish_to: "none"
          version: 1.0.0+1

          environment:
            sdk: ">=3.0.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            intl: ^0.19.0
            shared_preferences: ^2.2.3
            path_provider: ^2.1.3
            share_plus: ^10.0.0
            another_telephony: ^0.4.1

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

          # 3. Update all Dart files recursively to use another_telephony
          python3 -c "
          import os
          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f.endswith('.dart'):
                      path = os.path.join(root, f)
                      with open(path, 'r', encoding='utf-8', errors='ignore') as fp:
                          code = fp.read()
                      if 'package:telephony/telephony.dart' in code:
                          code = code.replace('package:telephony/telephony.dart', 'package:another_telephony/telephony.dart')
                          with open(path, 'w', encoding='utf-8') as fp:
                              fp.write(code)
          "

          # 4. Create fresh Android wrapper in safe path (bypasses hyphen in 'smart-money')
          rm -rf android
          mkdir -p /tmp/fresh_flutter_app
          flutter create --project-name smart_money_flutter --org com.dhana.smartmoney --platforms android /tmp/fresh_flutter_app
          cp -r /tmp/fresh_flutter_app/android ./android
          chmod +x android/gradlew

          # 5. Inject SMS & Notification permissions and receiver to AndroidManifest.xml
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              content = f.read()

          permissions = '''
              <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\"/>
              <uses-permission android:name=\"android.permission.RECEIVE_SMS\"/>
              <uses-permission android:name=\"android.permission.READ_SMS\"/>
              <uses-permission android:name=\"android.permission.SEND_SMS\"/>
              <uses-permission android:name=\"android.permission.READ_PHONE_STATE\"/>
              <uses-permission android:name=\"android.permission.VIBRATE\"/>
          '''
          receiver = '''
                  <receiver 
                      android:name=\"com.shounakmulay.telephony.sms.IncomingSmsReceiver\"
                      android:permission=\"android.permission.BROADCAST_SMS\"
                      android:exported=\"true\">
                      <intent-filter android:priority=\"999\">
                          <action android:name=\"android.provider.Telephony.SMS_RECEIVED\" />
                      </intent-filter>
                  </receiver>
          '''
          content = content.replace('<application', permissions + '\n    <application')
          content = content.replace('</activity>', '</activity>\n' + receiver)
          with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(content)
          "

          # 6. Configure local.properties and gradle.properties
          echo -e "\nflutter.minSdkVersion=21" >> android/local.properties
          cat << 'EOF' >> android/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.defaults.buildfeatures.buildconfig=true
          android.nonTransitiveRClass=false
          org.gradle.jvmargs=-Xmx4G
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Locate Built APK Files
        run: |
          echo "=== Locating Built APKs ==="
          find build/ -name "*.apk" -ls

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartMoney-Release-APK
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
            build/**/app-release.apk
            build/**/*.apk
          retention-days: 30
