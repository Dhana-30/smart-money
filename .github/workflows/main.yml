name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build SmartMoney APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Clean Android Build Environment
        run: |
          # 1. Reconstruct lib folder structure first if files were uploaded flat to root
          if [ ! -d "lib" ] && [ -f "main.dart" ]; then
            mkdir -p lib/models lib/providers lib/screens lib/services lib/widgets
            mv -f *_model.dart habit_badge.dart lib/models/ 2>/dev/null || true
            mv -f *_provider.dart lib/providers/ 2>/dev/null || true
            mv -f *_tab.dart home_screen.dart lib/screens/ 2>/dev/null || true
            mv -f *_service.dart lib/services/ 2>/dev/null || true
            mv -f *_modal.dart *_dialog.dart custom_charts.dart lib/widgets/ 2>/dev/null || true
            mv -f main.dart lib/
          fi

          # 2. Update telephony to another_telephony across ALL Dart files & pubspec.yaml
          python3 -c "
          import os

          # Update pubspec.yaml
          if os.path.exists('pubspec.yaml'):
              with open('pubspec.yaml', 'r', encoding='utf-8') as f:
                  text = f.read()
              text = text.replace('telephony: ^0.2.0', 'another_telephony: ^0.4.1')
              text = text.replace('telephony: any', 'another_telephony: ^0.4.1')
              with open('pubspec.yaml', 'w', encoding='utf-8') as f:
                  f.write(text)

          # Update all Dart files recursively
          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f.endswith('.dart'):
                      path = os.path.join(root, f)
                      with open(path, 'r', encoding='utf-8', errors='ignore') as fp:
                          code = fp.read()
                      if 'package:telephony/telephony.dart' in code:
                          code = code.replace('package:telephony/telephony.dart', 'package:another_telephony/telephony.dart')
                          with open(path, 'w', encoding='utf-8') as fp:
                              fp.write(code)
          "

          # 3. Create fresh Android wrapper in safe path (bypasses hyphen in 'smart-money')
          rm -rf android
          mkdir -p /tmp/fresh_flutter_app
          flutter create --project-name smart_money_flutter --org com.dhana.smartmoney --platforms android /tmp/fresh_flutter_app
          cp -r /tmp/fresh_flutter_app/android ./android
          chmod +x android/gradlew

          # 4. Inject SMS & Notification permissions and receiver to AndroidManifest.xml
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              content = f.read()

          permissions = '''
              <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\"/>
              <uses-permission android:name=\"android.permission.RECEIVE_SMS\"/>
              <uses-permission android:name=\"android.permission.READ_SMS\"/>
              <uses-permission android:name=\"android.permission.SEND_SMS\"/>
              <uses-permission android:name=\"android.permission.READ_PHONE_STATE\"/>
              <uses-permission android:name=\"android.permission.VIBRATE\"/>
              <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>
              <uses-permission android:name=\"android.permission.USE_FULL_SCREEN_INTENT\"/>
              <uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\"/>
          '''
          receiver = '''
                  <receiver 
                      android:name=\"com.shounakmulay.telephony.sms.IncomingSmsReceiver\"
                      android:permission=\"android.permission.BROADCAST_SMS\"
                      android:exported=\"true\">
                      <intent-filter android:priority=\"999\">
                          <action android:name=\"android.provider.Telephony.SMS_RECEIVED\" />
                      </intent-filter>
                  </receiver>
          '''
          content = content.replace('<application', permissions + '\n    <application')
          content = content.replace('</activity>', '</activity>\n' + receiver)
          with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(content)
          "

          # 5. Inject Gradle compatibility flags
          cat << 'EOF' >> android/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.defaults.buildfeatures.buildconfig=true
          android.nonTransitiveRClass=false
          org.gradle.jvmargs=-Xmx4G
          EOF

          # 6. Configure coreLibraryDesugaring and minSdk 24 (required for flutter_local_notifications & audioplayers)
          echo -e "\nflutter.minSdkVersion=24" >> android/local.properties
          python3 -c "
          import os
          for fname in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              if os.path.exists(fname):
                  with open(fname, 'r', encoding='utf-8') as f:
                      t = f.read()

                  t = t.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24\n        multiDexEnabled = true')
                  t = t.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24\n        multiDexEnabled true')
                  t = t.replace('minSdk flutter.minSdkVersion', 'minSdk 24\n        multiDexEnabled true')

                  if 'build.gradle.kts' in fname:
                      if 'isCoreLibraryDesugaringEnabled' not in t:
                          t = t.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
                      if 'desugar_jdk_libs' not in t:
                          if 'dependencies {' in t:
                              t = t.replace('dependencies {', 'dependencies {\n    add(\"coreLibraryDesugaring\", \"com.android.tools:desugar_jdk_libs:2.1.4\")\n')
                          else:
                              t += '\ndependencies {\n    add(\"coreLibraryDesugaring\", \"com.android.tools:desugar_jdk_libs:2.1.4\")\n}\n'
                  else:
                      if 'coreLibraryDesugaringEnabled' not in t:
                          t = t.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
                      if 'desugar_jdk_libs' not in t:
                          if 'dependencies {' in t:
                              t = t.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.1.4\"\n')
                          else:
                              t += '\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.1.4\"\n}\n'

                  with open(fname, 'w', encoding='utf-8') as f:
                      f.write(t)
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: |
          set -e
          flutter build apk --release --no-tree-shake-icons

      - name: Locate Built APK Files
        run: |
          echo "=== Locating Built APKs ==="
          find build/ -name "*.apk" -ls

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartMoney-Release-APK
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
            **/app-release.apk
          retention-days: 30
